<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="JARVIS personal AI assistant">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>JARVIS</title>
</head>
<body>
<div class="app">
<header>
  <button id="menuButton" class="icon" aria-label="Open menu">☰</button>
  <div class="brand"><span class="orb">J</span><div><strong>JARVIS</strong><small>PERSONAL AI</small></div></div>
  <div class="status"><span id="statusDot"></span><span id="statusText">CONNECTING</span></div>
</header>

<main>
<section class="core">
  <div class="ring ring1"></div><div class="ring ring2"></div><div class="ring ring3"></div>
  <div class="core-center"><b>J</b><span id="coreState">STANDBY</span></div>
</section>

<section class="welcome">
  <p>JARVIS CORE</p>
  <h1>How can I help?</h1>
  <span id="modelText">Checking connection...</span>
</section>

<section id="messages" class="messages" aria-live="polite"></section>

<form id="chatForm" class="composer">
  <input id="messageInput" autocomplete="off" placeholder="Talk to JARVIS..." maxlength="12000">
  <button id="sendButton" aria-label="Send">➜</button>
</form>
<p class="hint">TEXT MODE • SECURE SERVER CONNECTION</p>
</main>

<aside id="menu" class="menu" aria-hidden="true">
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="menu-card">
    <button id="closeMenu" class="close">×</button>
    <p>JARVIS</p>
    <h2>Command Deck</h2>
    <button class="menu-item" id="newChat">＋ New Chat</button>
    <button class="menu-item" id="clearChat">Clear Current Chat</button>
    <div class="menu-info">
      <span>BACKEND</span><b id="backendInfo">CHECKING</b>
      <span>MODEL</span><b id="menuModel">--</b>
    </div>
  </div>
</aside>
</div>
<script src="app.js"></script>
</body>
</html>
